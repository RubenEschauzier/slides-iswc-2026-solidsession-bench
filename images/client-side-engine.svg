<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="370" viewBox="0 0 500 370" font-family="Fira Sans">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#008b8b"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- Single client: its applications and one engine instance -->
  <text x="10" y="28" font-size="20">Single client</text>
  <rect x="10" y="40" width="270" height="320" rx="14" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="7 5"/>

  <g stroke="#000000" stroke-width="1.2" fill="#000000" fill-opacity="0.12">
    <rect x="30" y="60" width="105" height="50" rx="10"/>
    <rect x="155" y="60" width="105" height="50" rx="10"/>
  </g>
  <g font-size="18" text-anchor="middle">
    <text x="82.5" y="91">Social app</text>
    <text x="207.5" y="91">Chat app</text>
  </g>

  <g stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="82.5" y1="113" x2="82.5" y2="166"/>
    <line x1="207.5" y1="113" x2="207.5" y2="166"/>
  </g>
  <g font-size="16" fill="#666666" text-anchor="middle">
    <text x="145" y="137">query</text>
    <text x="145" y="156">sequence</text>
  </g>

  <rect x="30" y="170" width="230" height="170" rx="10" fill="#008b8f" fill-opacity="0.25" stroke="#000000" stroke-width="1.2"/>
  <text x="145" y="200" font-size="20" text-anchor="middle">LTQP engine</text>
  <rect x="50" y="255" width="190" height="65" rx="8" fill="#fada5e" fill-opacity="0.6" stroke="#000000" stroke-width="1.2"/>
  <text x="145" y="281" font-size="18" text-anchor="middle">Prior knowledge</text>
  <text x="145" y="305" font-size="15" fill="#666666" text-anchor="middle">cache, statistics, …</text>

  <!-- Decentralized environment -->
  <text x="400" y="28" font-size="20" text-anchor="middle">Decentralized pods</text>
  <g stroke="#d3d3d3" stroke-width="2.5">
    <line x1="330" y1="110" x2="400" y2="55"/>
    <line x1="440" y1="120" x2="400" y2="55"/>
    <line x1="440" y1="120" x2="470" y2="215"/>
    <line x1="370" y1="200" x2="470" y2="215"/>
  </g>
  <g stroke="#008b8b" stroke-width="3" marker-end="url(#arrow-teal)">
    <line x1="360" y1="186" x2="339" y2="126"/>
    <line x1="382" y1="186" x2="428" y2="134"/>
  </g>
  <g fill="#d3d3d3">
    <circle cx="400" cy="55" r="16"/>
    <circle cx="470" cy="215" r="16"/>
  </g>
  <g fill="#008b8b">
    <circle cx="370" cy="200" r="16"/>
    <circle cx="330" cy="110" r="16"/>
    <circle cx="440" cy="120" r="16"/>
  </g>

  <!-- Traverse, then learn from the execution -->
  <line x1="263" y1="203" x2="349" y2="201" stroke="#008b8b" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="320" y="192" font-size="16" fill="#666666" text-anchor="middle">traverse</text>
  <line x1="362" y1="220" x2="246" y2="286" stroke="#888888" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-grey)"/>
  <g font-size="16" fill="#666666">
    <text x="300" y="285">learn from</text>
    <text x="300" y="305">past executions</text>
  </g>
</svg>
