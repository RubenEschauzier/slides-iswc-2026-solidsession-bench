<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="360" viewBox="0 0 500 360" font-family="Fira Sans">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- Current query -->
  <rect x="20" y="30" width="200" height="70" rx="10" fill="#008b8f" fill-opacity="0.25" stroke="#000000" stroke-width="1.2"/>
  <text x="120" y="58" font-size="18" text-anchor="middle">Query i</text>
  <text x="120" y="84" font-size="16" fill="#555555" text-anchor="middle">posts by &lt;alice&gt;</text>

  <!-- Centralized execution -->
  <line x1="224" y1="65" x2="296" y2="65" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="55" font-size="15" fill="#666666" text-anchor="middle">execute</text>
  <text x="260" y="86" font-size="15" fill="#666666" text-anchor="middle">(QLever)</text>

  <!-- Result set with one sampled row -->
  <rect x="300" y="20" width="180" height="30" fill="#000000" fill-opacity="0.12"/>
  <rect x="300" y="80" width="180" height="30" fill="#fada5e" fill-opacity="0.8"/>
  <rect x="300" y="20" width="180" height="150" rx="4" fill="none" stroke="#000000" stroke-width="1.2"/>
  <g stroke="#d3d3d3" stroke-width="1">
    <line x1="300" y1="50" x2="480" y2="50"/>
    <line x1="300" y1="80" x2="480" y2="80"/>
    <line x1="300" y1="110" x2="480" y2="110"/>
    <line x1="300" y1="140" x2="480" y2="140"/>
  </g>
  <g font-family="Fira Mono" font-size="16">
    <text x="312" y="41">?post</text>
    <text x="312" y="71">post:17</text>
    <text x="312" y="101">post:42</text>
    <text x="312" y="131">post:93</text>
    <text x="312" y="161">…</text>
  </g>

  <!-- Sample a result to instantiate the next query -->
  <path d="M 298 95 C 250 95, 120 150, 120 236" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="150" font-size="15" fill="#666666">sample</text>

  <!-- Next query, chosen from the template graph -->
  <rect x="20" y="240" width="200" height="70" rx="10" fill="#008b8f" fill-opacity="0.25" stroke="#000000" stroke-width="1.2"/>
  <text x="120" y="268" font-size="18" text-anchor="middle">Query i+1</text>
  <text x="120" y="294" font-size="16" fill="#555555" text-anchor="middle">replies to post:42</text>

  <rect x="270" y="240" width="210" height="70" rx="10" fill="#000000" fill-opacity="0.12" stroke="#000000" stroke-width="1.2"/>
  <text x="375" y="268" font-size="18" text-anchor="middle">Template graph</text>
  <text x="375" y="294" font-size="15" fill="#555555" text-anchor="middle">successors by output type</text>
  <line x1="268" y1="275" x2="224" y2="275" stroke="#888888" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-grey)"/>

  <!-- Fallback -->
  <text x="20" y="345" font-size="15" font-style="italic" fill="#666666">No results → fall back to interest-based instantiation</text>
</svg>
