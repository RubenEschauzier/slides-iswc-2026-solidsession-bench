<?xml version="1.0" encoding="UTF-8"?>
<!-- Data: Table 2 of the paper, hit rate deviation (%) from the global template average.
     Bars: mean over the 9 cache configurations. Dots: individual configurations. -->
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" font-family="Fira Sans">
  <!-- Scale: y = 150 - 8 * value (value in %), range -25 .. +10 -->
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="70" y1="70" x2="540" y2="70"/>
    <line x1="70" y1="230" x2="540" y2="230"/>
    <line x1="70" y1="310" x2="540" y2="310"/>
  </g>
  <g font-size="15" fill="#666666" text-anchor="end">
    <text x="60" y="75">+10%</text>
    <text x="60" y="155">0%</text>
    <text x="60" y="235">−10%</text>
    <text x="60" y="315">−20%</text>
  </g>

  <!-- Mean bars (4px rounded data-end, anchored at 0) -->
  <g fill="#008b8b">
    <path d="M110,150 H210 V242.64 a4,4 0 0 1 -4,4 H114 a4,4 0 0 1 -4,-4 z"/>
    <path d="M265,150 H365 V176.08 a4,4 0 0 1 -4,4 H269 a4,4 0 0 1 -4,-4 z"/>
    <path d="M420,150 V132.40 a4,4 0 0 1 4,-4 H516 a4,4 0 0 1 4,4 V150 z"/>
  </g>
  <line x1="70" y1="150" x2="540" y2="150" stroke="#555555" stroke-width="1.5"/>

  <!-- Individual configurations -->
  <g fill="#555555" stroke="#ffffff" stroke-width="2">
    <circle cx="130" cy="248.22" r="5"/>
    <circle cx="140" cy="275.19" r="5"/>
    <circle cx="150" cy="344.20" r="5"/>
    <circle cx="160" cy="234.58" r="5"/>
    <circle cx="170" cy="92.61" r="5"/>
    <circle cx="180" cy="264.44" r="5"/>
    <circle cx="190" cy="190.09" r="5"/>
    <circle cx="160" cy="332.26" r="5"/>
    <circle cx="140" cy="238.29" r="5"/>

    <circle cx="285" cy="169.79" r="5"/>
    <circle cx="295" cy="213.20" r="5"/>
    <circle cx="305" cy="202.41" r="5"/>
    <circle cx="315" cy="172.37" r="5"/>
    <circle cx="325" cy="150.51" r="5"/>
    <circle cx="335" cy="181.37" r="5"/>
    <circle cx="345" cy="154.57" r="5"/>
    <circle cx="315" cy="190.78" r="5"/>
    <circle cx="295" cy="185.76" r="5"/>

    <circle cx="440" cy="134.55" r="5"/>
    <circle cx="450" cy="106.11" r="5"/>
    <circle cx="460" cy="113.34" r="5"/>
    <circle cx="470" cy="132.98" r="5"/>
    <circle cx="480" cy="150.28" r="5"/>
    <circle cx="490" cy="126.61" r="5"/>
    <circle cx="500" cy="146.26" r="5"/>
    <circle cx="470" cy="120.54" r="5"/>
    <circle cx="450" cy="124.78" r="5"/>
  </g>

  <!-- Direct labels: the three means -->
  <g font-size="20" font-weight="bold" text-anchor="middle" fill="#222222">
    <text x="160" y="40">−12.1%</text>
    <text x="315" y="40">−3.8%</text>
    <text x="470" y="40">+2.7%</text>
  </g>
  <g font-size="18" text-anchor="middle" fill="#222222">
    <text x="160" y="18">New session</text>
    <text x="315" y="18">Resume session</text>
    <text x="470" y="18">Within session</text>
  </g>
</svg>
