<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="370" viewBox="0 0 500 370" font-family="Fira Sans">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Row 1: micro benchmark, the same query with one isolated variable -->
  <text x="10" y="30" font-size="22">Micro benchmark</text>
  <g stroke="#000000" stroke-width="1.2">
    <rect x="10" y="45" width="80" height="50" rx="10" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="120" y="45" width="80" height="50" rx="10" fill="#008b8f" fill-opacity="0.25"/>
  </g>
  <g font-size="20" text-anchor="middle">
    <text x="50" y="77">Q1</text>
    <text x="160" y="77">Q1</text>
  </g>
  <line x1="94" y1="70" x2="116" y2="70" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="70" x2="450" y2="70" stroke="#d3d3d3" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="70" x2="330" y2="70" stroke="#008b8b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="330" cy="70" r="12" fill="#ffffff" stroke="#008b8b" stroke-width="3"/>
  <g font-size="15" fill="#666666" text-anchor="middle">
    <text x="250" y="48">0%</text>
    <text x="450" y="48">100%</text>
  </g>
  <text x="350" y="105" font-size="18" fill="#666666" text-anchor="middle">hit rate</text>

  <!-- Row 2: random grouping of unrelated queries -->
  <text x="10" y="160" font-size="22">Random grouping</text>
  <g stroke="#000000" stroke-width="1.2">
    <rect x="10" y="175" width="80" height="50" rx="10" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="120" y="175" width="80" height="50" rx="10" fill="#fada5e" fill-opacity="0.6"/>
    <rect x="230" y="175" width="80" height="50" rx="10" fill="#000000" fill-opacity="0.12"/>
    <rect x="340" y="175" width="80" height="50" rx="10" fill="#667e2c" fill-opacity="0.35"/>
  </g>
  <g font-size="20" text-anchor="middle">
    <text x="50" y="207">Q7</text>
    <text x="160" y="207">Q2</text>
    <text x="270" y="207">Q9</text>
    <text x="380" y="207">Q4</text>
  </g>
  <g stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="94" y1="200" x2="116" y2="200"/>
    <line x1="204" y1="200" x2="226" y2="200"/>
    <line x1="314" y1="200" x2="336" y2="200"/>
  </g>

  <!-- Row 3: real-world query log, related refinements, unavailable for LTQP -->
  <text x="10" y="290" font-size="22">Real-world query log</text>
  <text x="490" y="290" font-size="18" font-style="italic" fill="#666666" text-anchor="end">none for LTQP</text>
  <g stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4">
    <rect x="10" y="305" width="80" height="50" rx="10" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="120" y="305" width="80" height="50" rx="10" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="230" y="305" width="80" height="50" rx="10" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="340" y="305" width="80" height="50" rx="10" fill="#fada5e" fill-opacity="0.6"/>
  </g>
  <g font-size="20" text-anchor="middle">
    <text x="50" y="337">Q1</text>
    <text x="160" y="337">Q1′</text>
    <text x="270" y="337">Q1″</text>
    <text x="380" y="337">Q5</text>
  </g>
  <g stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="94" y1="330" x2="116" y2="330"/>
    <line x1="204" y1="330" x2="226" y2="330"/>
    <line x1="314" y1="330" x2="336" y2="330"/>
  </g>
</svg>
