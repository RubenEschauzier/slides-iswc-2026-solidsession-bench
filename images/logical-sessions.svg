<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="630" height="290" viewBox="0 0 630 290" font-family="Fira Sans">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- Session labels -->
  <text x="10" y="33" font-size="20" fill="#008b8b">Session 1: <tspan fill="#666666">follow a creator</tspan></text>
  <g font-size="20" text-anchor="end">
    <text x="250" y="192" fill="#b8962e">Session 2:</text>
    <text x="250" y="214" fill="#666666">explore a topic</text>
  </g>

  <!-- Queries: session 1 (teal), session 2 (yellow) -->
  <g stroke="#000000" stroke-width="1.2">
    <rect x="10" y="45" width="96" height="50" rx="10" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="138" y="45" width="96" height="50" rx="10" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="266" y="165" width="96" height="50" rx="10" fill="#fada5e" fill-opacity="0.6"/>
    <rect x="394" y="165" width="96" height="50" rx="10" fill="#fada5e" fill-opacity="0.6"/>
    <rect x="522" y="45" width="96" height="50" rx="10" fill="#008b8f" fill-opacity="0.25"/>
  </g>
  <g font-size="21" text-anchor="middle">
    <text x="58" y="77">Feed</text>
    <text x="186" y="77">Creator</text>
    <text x="314" y="197">Search</text>
    <text x="442" y="197">Forum</text>
    <text x="570" y="77">Posts</text>
  </g>

  <!-- Click-through within a session -->
  <g stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="109" y1="70" x2="135" y2="70"/>
    <line x1="365" y1="190" x2="391" y2="190"/>
  </g>

  <!-- Session switches -->
  <g stroke="#888888" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-grey)">
    <line x1="202" y1="99" x2="290" y2="161"/>
    <line x1="470" y1="161" x2="548" y2="99"/>
  </g>
  <g font-size="17" fill="#666666">
    <text x="275" y="118">new</text>
    <text x="275" y="139">session</text>
    <text x="515" y="135">resume</text>
    <text x="515" y="156">session 1</text>
  </g>

  <!-- Time axis -->
  <line x1="10" y1="250" x2="615" y2="250" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="615" y="277" font-size="17" fill="#666666" text-anchor="end">time</text>
</svg>
