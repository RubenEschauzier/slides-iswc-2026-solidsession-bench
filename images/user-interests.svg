<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="370" viewBox="0 0 500 370" font-family="Fira Sans">
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#008b8b"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- Community labels -->
  <g font-size="20" text-anchor="middle">
    <text x="120" y="85">Interest: Music</text>
    <text x="400" y="85">Interest: Sports</text>
  </g>
  <text x="260" y="310" font-size="16" fill="#666666" text-anchor="middle">high-degree core</text>

  <!-- Social links -->
  <g stroke="#d3d3d3" stroke-width="2.5">
    <!-- Music community -->
    <line x1="80" y1="130" x2="170" y2="160"/>
    <line x1="80" y1="130" x2="60" y2="220"/>
    <line x1="60" y1="220" x2="110" y2="300"/>
    <line x1="110" y1="300" x2="180" y2="260"/>
    <line x1="180" y1="260" x2="170" y2="160"/>
    <!-- Sports community -->
    <line x1="440" y1="130" x2="350" y2="160"/>
    <line x1="350" y1="160" x2="400" y2="210"/>
    <line x1="400" y1="210" x2="460" y2="220"/>
    <line x1="460" y1="220" x2="410" y2="300"/>
    <line x1="410" y1="300" x2="340" y2="260"/>
    <line x1="340" y1="260" x2="400" y2="210"/>
    <line x1="440" y1="130" x2="400" y2="210"/>
    <line x1="340" y1="260" x2="350" y2="160"/>
    <!-- Core connecting both communities -->
    <line x1="260" y1="130" x2="260" y2="270"/>
    <line x1="260" y1="130" x2="170" y2="160"/>
    <line x1="260" y1="130" x2="80" y2="130"/>
    <line x1="260" y1="130" x2="350" y2="160"/>
    <line x1="260" y1="130" x2="440" y2="130"/>
    <line x1="260" y1="270" x2="180" y2="260"/>
    <line x1="260" y1="270" x2="110" y2="300"/>
    <line x1="260" y1="270" x2="340" y2="260"/>
    <line x1="260" y1="270" x2="410" y2="300"/>
  </g>

  <!-- Queries from the base user: similar users are more likely -->
  <g stroke="#008b8b" stroke-width="3" marker-end="url(#arrow-teal)">
    <line x1="112.8" y1="195.7" x2="86.7" y2="143.4"/>
    <line x1="131.3" y1="198.7" x2="159.4" y2="170.6"/>
    <line x1="132.3" y1="220.2" x2="168.5" y2="250.4"/>
    <line x1="104.2" y1="212.6" x2="74.8" y2="217.5"/>
    <line x1="118.2" y1="225.9" x2="111.7" y2="285.1"/>
  </g>
  <line x1="136" y1="210" x2="385" y2="210" stroke="#888888" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-grey)"/>

  <!-- Users -->
  <g fill="#008b8b">
    <circle cx="80" cy="130" r="12"/>
    <circle cx="60" cy="220" r="12"/>
    <circle cx="110" cy="300" r="12"/>
    <circle cx="180" cy="260" r="12"/>
    <circle cx="170" cy="160" r="12"/>
  </g>
  <g fill="#fada5e">
    <circle cx="440" cy="130" r="12"/>
    <circle cx="460" cy="220" r="12"/>
    <circle cx="410" cy="300" r="12"/>
    <circle cx="340" cy="260" r="12"/>
    <circle cx="350" cy="160" r="12"/>
    <circle cx="400" cy="210" r="12"/>
  </g>
  <g fill="#d3d3d3">
    <circle cx="260" cy="130" r="16"/>
    <circle cx="260" cy="270" r="16"/>
  </g>
  <circle cx="120" cy="210" r="14" fill="#667e2c"/>

  <!-- Legend -->
  <g font-size="17">
    <circle cx="20" cy="350" r="9" fill="#667e2c"/>
    <text x="36" y="356">base user</text>
    <line x1="150" y1="350" x2="192" y2="350" stroke="#008b8b" stroke-width="3" marker-end="url(#arrow-teal)"/>
    <text x="202" y="356">more likely</text>
    <line x1="315" y1="350" x2="357" y2="350" stroke="#888888" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-grey)"/>
    <text x="367" y="356">less likely</text>
  </g>
</svg>
