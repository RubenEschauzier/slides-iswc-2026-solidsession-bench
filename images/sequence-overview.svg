<?xml version="1.0" encoding="UTF-8"?>
<!-- One generated query sequence: interest-based session starts, a refinement streak, and session switches -->
<svg xmlns="http://www.w3.org/2000/svg" width="690" height="200" viewBox="0 0 690 200" font-family="Fira Sans">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- Refinement streak -->
  <path d="M116,62 V54 H378 V62" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="247" y="44" font-size="17" fill="#666666" text-anchor="middle">refinement streak</text>

  <!-- Interest-based session starts -->
  <g fill="#667e2c">
    <circle cx="55" cy="52" r="8"/>
    <circle cx="439" cy="52" r="8"/>
  </g>

  <!-- Queries: session 1 (teal), session 2 (yellow) -->
  <g stroke="#000000" stroke-width="1.2">
    <rect x="20" y="70" width="70" height="44" rx="8" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="116" y="70" width="70" height="44" rx="8" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="212" y="70" width="70" height="44" rx="8" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="308" y="70" width="70" height="44" rx="8" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="404" y="70" width="70" height="44" rx="8" fill="#fada5e" fill-opacity="0.6"/>
    <rect x="500" y="70" width="70" height="44" rx="8" fill="#fada5e" fill-opacity="0.6"/>
    <rect x="596" y="70" width="70" height="44" rx="8" fill="#008b8f" fill-opacity="0.25"/>
  </g>
  <!-- Refined queries carry a stripe -->
  <g fill="#fada5e">
    <rect x="222" y="102" width="50" height="5" rx="2.5"/>
    <rect x="318" y="102" width="50" height="5" rx="2.5"/>
  </g>
  <g font-size="19" text-anchor="middle">
    <text x="55" y="97">Q1</text>
    <text x="151" y="97">Q2</text>
    <text x="247" y="95">Q2′</text>
    <text x="343" y="95">Q2″</text>
    <text x="439" y="97">Q3</text>
    <text x="535" y="97">Q4</text>
    <text x="631" y="97">Q5</text>
  </g>

  <!-- Within a session -->
  <g stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="93" y1="92" x2="113" y2="92"/>
    <line x1="189" y1="92" x2="209" y2="92"/>
    <line x1="285" y1="92" x2="305" y2="92"/>
    <line x1="477" y1="92" x2="497" y2="92"/>
  </g>
  <!-- Session switches -->
  <g stroke="#888888" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-grey)">
    <line x1="381" y1="92" x2="401" y2="92"/>
    <line x1="573" y1="92" x2="593" y2="92"/>
  </g>

  <!-- Sessions -->
  <g fill="none" stroke-width="1.5">
    <path d="M20,122 V130 H378 V122" stroke="#008b8b"/>
    <path d="M404,122 V130 H570 V122" stroke="#b8962e"/>
    <path d="M596,122 V130 H666 V122" stroke="#008b8b"/>
  </g>
  <g font-size="17" text-anchor="middle">
    <text x="199" y="152" fill="#008b8b">Session 1</text>
    <text x="487" y="152" fill="#b8962e">Session 2</text>
    <text x="631" y="152" fill="#008b8b">resume 1</text>
  </g>

  <!-- Legend -->
  <g font-size="15" fill="#666666">
    <circle cx="28" cy="184" r="7" fill="#667e2c"/>
    <text x="42" y="189">interest-based start</text>
    <line x1="210" y1="184" x2="240" y2="184" stroke="#888888" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-grey)"/>
    <text x="250" y="189">session switch</text>
    <rect x="380" y="181" width="30" height="5" rx="2.5" fill="#fada5e"/>
    <text x="420" y="189">refined query</text>
  </g>
</svg>
