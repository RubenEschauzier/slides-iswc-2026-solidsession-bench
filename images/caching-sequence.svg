<?xml version="1.0" encoding="UTF-8"?>
<!-- First query misses and fetches documents over the network, correlated follow-up queries hit the cache -->
<svg xmlns="http://www.w3.org/2000/svg" width="490" height="350" viewBox="0 0 490 350" font-family="Fira Sans">
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#008b8b"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#888888"/>
    </marker>
    <!-- Cached RDF document -->
    <g id="doc">
      <path d="M0,0 H28 L40,12 V50 H0 z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <path d="M28,0 V12 H40" fill="none" stroke="#000000" stroke-width="1.2"/>
      <g fill="#008b8b">
        <rect x="6" y="20" width="28" height="4" rx="2"/>
        <rect x="6" y="29" width="28" height="4" rx="2"/>
        <rect x="6" y="38" width="20" height="4" rx="2"/>
      </g>
    </g>
  </defs>

  <!-- Column labels -->
  <g font-size="20" text-anchor="middle">
    <text x="60" y="28">queries</text>
    <text x="245" y="28">cache</text>
    <text x="440" y="28">pods</text>
  </g>

  <!-- Query sequence -->
  <g stroke="#000000" stroke-width="1.2" fill="#008b8f" fill-opacity="0.25">
    <rect x="20" y="60" width="80" height="44" rx="8"/>
    <rect x="20" y="158" width="80" height="44" rx="8"/>
    <rect x="20" y="256" width="80" height="44" rx="8"/>
  </g>
  <g font-size="20" text-anchor="middle">
    <text x="60" y="89">Q1</text>
    <text x="60" y="187">Q2</text>
    <text x="60" y="285">Q3</text>
  </g>

  <!-- Cache with documents from earlier queries -->
  <rect x="170" y="40" width="150" height="290" rx="10" fill="#fada5e" fill-opacity="0.6" stroke="#000000" stroke-width="1.2"/>
  <use href="#doc" x="190" y="120"/>
  <use href="#doc" x="260" y="120"/>
  <use href="#doc" x="190" y="215"/>
  <use href="#doc" x="260" y="215"/>

  <!-- Pods -->
  <g fill="#d3d3d3">
    <circle cx="440" cy="85" r="22"/>
    <circle cx="440" cy="185" r="22"/>
    <circle cx="440" cy="285" r="22"/>
  </g>

  <!-- Q1 misses: fetch over the network, then store in the cache -->
  <line x1="104" y1="82" x2="414" y2="85" stroke="#888888" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-grey)"/>
  <line x1="420" y1="100" x2="304" y2="132" stroke="#888888" stroke-width="1.8" marker-end="url(#arrow-grey)"/>
  <!-- Q2 and Q3 hit -->
  <g stroke="#008b8b" stroke-width="3" marker-end="url(#arrow-teal)">
    <line x1="104" y1="180" x2="184" y2="152"/>
    <line x1="104" y1="278" x2="184" y2="245"/>
  </g>

  <g font-size="17" fill="#666666">
    <text x="112" y="72">miss</text>
    <text x="345" y="72">slow</text>
  </g>
  <g font-size="17" fill="#008b8b">
    <text x="112" y="208">hit</text>
    <text x="112" y="306">hit</text>
  </g>
</svg>
