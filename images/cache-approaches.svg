<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Fira Sans">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#000000"/>
    </marker>
    <!-- One raw triple: subject, predicate, object -->
    <g id="triple-raw">
      <rect x="0" y="0" width="8" height="8" rx="1.5" fill="#888888"/>
      <rect x="9" y="0" width="8" height="8" rx="1.5" fill="#888888"/>
      <rect x="18" y="0" width="8" height="8" rx="1.5" fill="#888888"/>
    </g>
    <g id="triple-match">
      <rect x="0" y="0" width="8" height="8" rx="1.5" fill="#008b8b"/>
      <rect x="9" y="0" width="8" height="8" rx="1.5" fill="#008b8b"/>
      <rect x="18" y="0" width="8" height="8" rx="1.5" fill="#008b8b"/>
    </g>
    <!-- One indexed store: three permutation indexes, matching entries in teal -->
    <g id="index-store">
      <g font-size="12" fill="#555555" text-anchor="middle">
        <text x="25" y="0">SPO</text>
        <text x="85" y="0">POS</text>
        <text x="145" y="0">OSP</text>
      </g>
      <g fill="#ffffff" stroke="#888888" stroke-width="1">
        <rect x="0" y="6" width="50" height="52" rx="3"/>
        <rect x="60" y="6" width="50" height="52" rx="3"/>
        <rect x="120" y="6" width="50" height="52" rx="3"/>
      </g>
      <g fill="#d3d3d3">
        <rect x="5" y="11" width="40" height="8" rx="2"/>
        <rect x="5" y="23" width="40" height="8" rx="2"/>
        <rect x="5" y="35" width="40" height="8" rx="2"/>
        <rect x="5" y="47" width="40" height="6" rx="2"/>
        <rect x="65" y="11" width="40" height="8" rx="2"/>
        <rect x="65" y="23" width="40" height="8" rx="2"/>
        <rect x="65" y="35" width="40" height="8" rx="2"/>
        <rect x="65" y="47" width="40" height="6" rx="2"/>
        <rect x="125" y="11" width="40" height="8" rx="2"/>
        <rect x="125" y="23" width="40" height="8" rx="2"/>
        <rect x="125" y="35" width="40" height="8" rx="2"/>
        <rect x="125" y="47" width="40" height="6" rx="2"/>
      </g>
      <g fill="#008b8b">
        <rect x="65" y="23" width="40" height="8" rx="2"/>
        <rect x="65" y="35" width="40" height="8" rx="2"/>
      </g>
    </g>
  </defs>

  <!-- Cards: one per caching approach -->
  <g stroke="#000000" stroke-width="1.2" fill="none">
    <rect x="20" y="20" width="260" height="300" rx="12"/>
    <rect x="320" y="20" width="260" height="300" rx="12"/>
    <rect x="620" y="20" width="260" height="300" rx="12"/>
  </g>
  <g fill="#000000" fill-opacity="0.12">
    <path d="M20,70 V32 a12,12 0 0 1 12,-12 H268 a12,12 0 0 1 12,12 V70 z"/>
    <path d="M320,70 V32 a12,12 0 0 1 12,-12 H568 a12,12 0 0 1 12,12 V70 z"/>
    <path d="M620,70 V32 a12,12 0 0 1 12,-12 H868 a12,12 0 0 1 12,12 V70 z"/>
  </g>
  <g stroke="#000000" stroke-width="1.2">
    <line x1="20" y1="70" x2="280" y2="70"/>
    <line x1="320" y1="70" x2="580" y2="70"/>
    <line x1="620" y1="70" x2="880" y2="70"/>
  </g>
  <g font-size="22" text-anchor="middle">
    <text x="150" y="53">Unindexed cache</text>
    <text x="450" y="53">Indexed cache</text>
    <text x="750" y="53">+ Cardinality estimation</text>
  </g>

  <!-- Cache boxes -->
  <g stroke="#000000" stroke-width="1.2" fill="#fada5e" fill-opacity="0.6">
    <rect x="45" y="85" width="210" height="100" rx="8"/>
    <rect x="345" y="85" width="210" height="100" rx="8"/>
    <rect x="645" y="85" width="210" height="100" rx="8"/>
  </g>
  <g font-size="15" fill="#555555">
    <text x="55" y="103">cache: triple arrays</text>
    <text x="355" y="103">cache: indexed store</text>
    <text x="655" y="103">cache: indexed store</text>
  </g>

  <!-- Unindexed: one array of raw triples per document -->
  <g font-family="Fira Mono" font-size="16" fill="#555555">
    <text x="58" y="129">[</text>
    <text x="232" y="129">]</text>
    <text x="58" y="151">[</text>
    <text x="232" y="151">]</text>
    <text x="58" y="173">[</text>
    <text x="232" y="173">]</text>
  </g>
  <use href="#triple-raw" x="72" y="119"/>
  <use href="#triple-raw" x="104" y="119"/>
  <use href="#triple-raw" x="136" y="119"/>
  <use href="#triple-raw" x="168" y="119"/>
  <use href="#triple-raw" x="200" y="119"/>
  <use href="#triple-raw" x="72" y="141"/>
  <use href="#triple-raw" x="104" y="141"/>
  <use href="#triple-raw" x="136" y="141"/>
  <use href="#triple-raw" x="72" y="163"/>
  <use href="#triple-raw" x="104" y="163"/>
  <use href="#triple-raw" x="136" y="163"/>
  <use href="#triple-raw" x="168" y="163"/>

  <!-- Indexed and estimation: a proper indexed store -->
  <use href="#index-store" x="365" y="122"/>
  <use href="#index-store" x="665" y="122"/>

  <!-- On a cache hit -->
  <g stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="150" y1="188" x2="150" y2="222"/>
    <line x1="450" y1="188" x2="450" y2="222"/>
    <line x1="750" y1="188" x2="750" y2="222"/>
  </g>
  <g font-size="15" fill="#555555">
    <text x="160" y="210">index all</text>
    <text x="460" y="210">only matches</text>
    <text x="760" y="210">cardinalities</text>
  </g>

  <!-- Local stores of the running query -->
  <g stroke="#000000" stroke-width="1.2" fill="#008b8f" fill-opacity="0.25">
    <rect x="45" y="225" width="210" height="70" rx="8"/>
    <rect x="345" y="225" width="210" height="70" rx="8"/>
  </g>
  <g font-size="15" fill="#555555">
    <text x="55" y="243">local store</text>
    <text x="355" y="243">local store</text>
  </g>
  <use href="#triple-raw" x="60" y="256"/>
  <use href="#triple-raw" x="92" y="256"/>
  <use href="#triple-raw" x="124" y="256"/>
  <use href="#triple-raw" x="156" y="256"/>
  <use href="#triple-raw" x="188" y="256"/>
  <use href="#triple-raw" x="220" y="256"/>
  <use href="#triple-raw" x="60" y="274"/>
  <use href="#triple-raw" x="92" y="274"/>
  <use href="#triple-raw" x="124" y="274"/>
  <use href="#triple-raw" x="156" y="274"/>
  <use href="#triple-raw" x="188" y="274"/>
  <use href="#triple-raw" x="220" y="274"/>
  <use href="#triple-match" x="360" y="256"/>
  <use href="#triple-match" x="392" y="256"/>

  <!-- Estimation feeds the optimizer instead -->
  <rect x="645" y="225" width="210" height="70" rx="8" fill="#000000" fill-opacity="0.12" stroke="#000000" stroke-width="1.2"/>
  <text x="750" y="253" font-size="17" text-anchor="middle">cost-based</text>
  <text x="750" y="275" font-size="17" text-anchor="middle">query plan</text>
</svg>
