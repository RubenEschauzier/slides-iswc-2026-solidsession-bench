<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Fira Sans">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- Cards: one per extended SolidBench component -->
  <g stroke="#000000" stroke-width="1.2">
    <rect x="20" y="20" width="260" height="280" rx="12" fill="none"/>
    <rect x="320" y="20" width="260" height="280" rx="12" fill="none"/>
    <rect x="620" y="20" width="260" height="280" rx="12" fill="none"/>
  </g>
  <g fill="#000000" fill-opacity="0.12">
    <path d="M20,70 V32 a12,12 0 0 1 12,-12 H268 a12,12 0 0 1 12,12 V70 z"/>
    <path d="M320,70 V32 a12,12 0 0 1 12,-12 H568 a12,12 0 0 1 12,12 V70 z"/>
    <path d="M620,70 V32 a12,12 0 0 1 12,-12 H868 a12,12 0 0 1 12,12 V70 z"/>
  </g>
  <g stroke="#000000" stroke-width="1.2">
    <line x1="20" y1="70" x2="280" y2="70"/>
    <line x1="320" y1="70" x2="580" y2="70"/>
    <line x1="620" y1="70" x2="880" y2="70"/>
  </g>
  <g font-size="22" text-anchor="middle">
    <text x="150" y="53">Dataset generator</text>
    <text x="450" y="53">Query generator</text>
    <text x="750" y="53">Benchmark runner</text>
  </g>

  <!-- Pipeline between components -->
  <g stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="284" y1="185" x2="316" y2="185"/>
    <line x1="584" y1="185" x2="616" y2="185"/>
  </g>

  <!-- Dataset generator: users linked by similar interests -->
  <g stroke="#d3d3d3" stroke-width="2.5">
    <line x1="65" y1="120" x2="115" y2="110"/>
    <line x1="65" y1="120" x2="95" y2="170"/>
    <line x1="115" y1="110" x2="95" y2="170"/>
    <line x1="95" y1="170" x2="60" y2="220"/>
    <line x1="95" y1="170" x2="125" y2="235"/>
    <line x1="60" y1="220" x2="125" y2="235"/>
    <line x1="185" y1="115" x2="235" y2="125"/>
    <line x1="185" y1="115" x2="205" y2="175"/>
    <line x1="235" y1="125" x2="205" y2="175"/>
    <line x1="205" y1="175" x2="240" y2="225"/>
    <line x1="205" y1="175" x2="175" y2="240"/>
    <line x1="175" y1="240" x2="240" y2="225"/>
    <line x1="125" y1="235" x2="175" y2="240"/>
    <line x1="115" y1="110" x2="185" y2="115"/>
  </g>
  <g fill="#008b8b">
    <circle cx="65" cy="120" r="11"/>
    <circle cx="115" cy="110" r="11"/>
    <circle cx="95" cy="170" r="11"/>
    <circle cx="60" cy="220" r="11"/>
    <circle cx="125" cy="235" r="11"/>
  </g>
  <g fill="#fada5e">
    <circle cx="185" cy="115" r="11"/>
    <circle cx="235" cy="125" r="11"/>
    <circle cx="205" cy="175" r="11"/>
    <circle cx="240" cy="225" r="11"/>
    <circle cx="175" cy="240" r="11"/>
  </g>

  <!-- Query generator: session with a refinement, then a session switch -->
  <g stroke="#000000" stroke-width="1.2">
    <rect x="390" y="90" width="120" height="36" rx="8" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="390" y="144" width="120" height="36" rx="8" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="390" y="198" width="120" height="36" rx="8" fill="#008b8f" fill-opacity="0.25"/>
    <rect x="390" y="252" width="120" height="36" rx="8" fill="#fada5e" fill-opacity="0.6"/>
  </g>
  <rect x="400" y="222" width="100" height="5" rx="2.5" fill="#fada5e"/>
  <g font-size="17" text-anchor="middle">
    <text x="450" y="114">Q1</text>
    <text x="450" y="168">Q2</text>
    <text x="450" y="213">Q2′</text>
    <text x="450" y="276">Q3</text>
  </g>
  <g stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-small)">
    <line x1="450" y1="128" x2="450" y2="142"/>
    <line x1="450" y1="182" x2="450" y2="196"/>
  </g>
  <line x1="450" y1="236" x2="450" y2="250" stroke="#888888" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-grey)"/>

  <!-- Benchmark runner: sequence executed over time -->
  <rect x="640" y="90" width="220" height="195" rx="8" fill="none" stroke="#000000" stroke-width="1.2"/>
  <path d="M640,114 V98 a8,8 0 0 1 8,-8 H852 a8,8 0 0 1 8,8 V114 z" fill="#000000" fill-opacity="0.12"/>
  <line x1="640" y1="114" x2="860" y2="114" stroke="#000000" stroke-width="1.2"/>
  <g fill="#888888">
    <circle cx="654" cy="102" r="4.5"/>
    <circle cx="668" cy="102" r="4.5"/>
    <circle cx="682" cy="102" r="4.5"/>
  </g>
  <g>
    <rect x="655" y="130" width="60" height="22" rx="4" fill="#008b8b"/>
    <rect x="715" y="162" width="32" height="22" rx="4" fill="#008b8b"/>
    <rect x="747" y="194" width="50" height="22" rx="4" fill="#008b8b"/>
    <rect x="747" y="203" width="50" height="6" fill="#fada5e"/>
    <rect x="797" y="226" width="48" height="22" rx="4" fill="#fada5e"/>
  </g>
  <line x1="655" y1="268" x2="845" y2="268" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- What SolidSessionBench adds -->
  <g font-size="20" text-anchor="middle" fill="#008b8b">
    <text x="150" y="338">+ user similarity</text>
    <text x="450" y="338">+ query sequences</text>
    <text x="750" y="338">+ sequence execution</text>
  </g>
</svg>
